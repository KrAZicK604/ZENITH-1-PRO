name: Alpha offline demo safety gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'FINAL_ALPHA_v2_1_REPAIRED_LOCAL.html'
      - 'tests/test_alpha_demo_gate.py'
      - '.github/workflows/alpha-demo-safety.yml'
permissions:
  contents: read
jobs:
  static-demo-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify offline demo safety claims
        run: python3 -B -m unittest discover -s tests -p 'test_alpha_demo_gate.py' -v
