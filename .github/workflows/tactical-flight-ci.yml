name: Tactical low-poly flight regression
on:
  pull_request:
    paths:
      - 'public/tactical-*'
      - 'tests/tactical-*'
      - '.github/workflows/tactical-flight-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check public/tactical-core.mjs
          node --check public/tactical-app.mjs
          node --test tests/tactical-core.test.mjs
