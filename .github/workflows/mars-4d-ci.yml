name: Mars Race 3D ship / 4D dynamics
on:
  pull_request:
    paths:
      - 'public/game-4d*'
      - 'tests/game-4d*'
      - '.github/workflows/mars-4d-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  math-and-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check 3D simulation and renderer
        run: |
          node --check public/game-4d-core.mjs
          node --check public/game-4d-app.mjs
          node --check tests/game-4d-core.test.mjs
      - name: Run deterministic 3D physics and swept collision tests
        run: node --test tests/game-4d-core.test.mjs
