name: ZENITH P0 browser regression
on:
  push:
    branches: [research/zenith-p0-runtime-20261125]
  pull_request:
    branches: [fix/alpha-payment-truth-and-player-notice-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/zenith_p0_browser.py
