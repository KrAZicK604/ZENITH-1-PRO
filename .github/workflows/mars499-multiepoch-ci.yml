name: Mars 499 multiepoch SPICE numerical gate
on:
  push:
    branches:
      - gate/mars499-multiepoch-spice-v6-20261112
    paths:
      - 'tools/mars499_multi_epoch_gate.py'
      - '.github/workflows/mars499-multiepoch-ci.yml'
      - 'docs/MARS499_MULTIEPOCH_GATE.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -B -m py_compile tools/mars499_multi_epoch_gate.py
      - name: Install independent NAIF CSPICE wrapper
        run: python -m pip install --disable-pip-version-check --no-cache-dir spiceypy==6.0.3
      - name: Acquire genuine multi-epoch Horizons states and compare against DE440s MAR099s
        run: python -B tools/mars499_multi_epoch_gate.py
      - name: Retain original API evidence and result with controlled artifact size
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mars499-multiepoch-raw-and-receipt
          path: artifacts/mars499-multiepoch/*.json
          if-no-files-found: error
          retention-days: 30
