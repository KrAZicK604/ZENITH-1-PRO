name: Python security and syntax checks

on:
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/python-security.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -B -m py_compile app.py cloud_webhook.py subscription_store.py webhook_server.py tests/test_cloud_webhook_security.py tests/test_subscription_store.py tests/test_checkout_mapping.py
      - name: Run isolated webhook security tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
