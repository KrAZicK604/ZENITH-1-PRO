name: Python security and syntax checks

on:
  pull_request:
  push:
    branches: [main]
  # Regression detection for dependency drift after release; runs on default branch only.
  schedule:
    - cron: '23 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4 tag head
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # verified v5 tag head
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-ci-pinned.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Verify installed package versions match pinned inventory
        run: |
          python -m pip freeze > /tmp/zenith-actual-freeze.txt
          grep -v '^#' requirements-ci-pinned.txt | sed '/^[[:space:]]*$/d' > /tmp/zenith-required-freeze.txt
          diff -u /tmp/zenith-required-freeze.txt /tmp/zenith-actual-freeze.txt
      - name: Record resolved dependencies
        run: python -m pip freeze
      - name: Audit application dependencies
        run: |
          python -m venv /tmp/zenith-audit
          /tmp/zenith-audit/bin/python -m pip install pip-audit
          /tmp/zenith-audit/bin/python -m pip_audit --path "$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
      - name: Check Python syntax
        run: python -B -m py_compile app.py cloud_webhook.py subscription_store.py webhook_server.py tests/test_cloud_webhook_security.py tests/test_subscription_store.py tests/test_checkout_mapping.py tests/test_webhook_crypto.py tests/test_webhook_journal.py sandbox_preflight.py tests/test_sandbox_preflight.py
      - name: Run isolated webhook security tests
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
