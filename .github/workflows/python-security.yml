name: Python security and syntax checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -B -m py_compile app.py cloud_webhook.py webhook_server.py
      - run: python -B -m unittest discover -s tests -p 'test_*.py' -v
