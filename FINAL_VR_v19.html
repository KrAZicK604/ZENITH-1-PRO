<!DOCTYPE html><html><head><meta charset=utf-8><title>ZENITH v19 CINEMATIC VR</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:radial-gradient(ellipse at center,#0a0a2a 0%,#000005 100%);overflow:hidden;font-family:monospace;height:100vh;display:flex;justify-content:center;align-items:center}#container{position:relative;width:100%;max-width:1400px;height:100vh;display:flex;justify-content:center;align-items:center}#hud{position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.95);color:#0ff;padding:22px;border:2px solid #0ff;border-radius:15px;z-index:100;min-width:320px;box-shadow:0 0 30px rgba(0,255,255,0.4)}button{background:linear-gradient(135deg,#0ff,#00aaff);color:#000;padding:14px 24px;font-weight:900;border:none;border-radius:10px;cursor:pointer;width:100%;margin-top:12px}canvas{border-radius:20px}</style></head><body><div id=container><div id=hud><h1>🚀 ZENITH-1-PRO v19</h1>REAL 259.1M km | Psi 1.133<br>Dist: <span id=d>0.0</span>/259.1M km<br>Status: <span id=s>READY</span><br><button onclick=launch()>🚀 LAUNCH TO MARS</button><button onclick=reset() style=background:#222;color:#0ff;border:1px solid #0ff;margin-top:8px>RESET</button></div><canvas id=c></canvas></div><script>let cv=document.getElementById('c'),ctx=cv.getContext('2d'),prog=0,flying=false,t=0,stars=[];let W,H,cx,cy;function resize(){W=cv.width=innerWidth>1400?1400:innerWidth;H=cv.height=innerHeight;cx=W/2;cy=H/2;stars=[];for(let i=0;i<600;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.3,b:Math.random()*0.8+0.2})}resize();onresize=resize;function draw(){let bg=ctx.createRadialGradient(cx,cy,0,cx,cy,H);bg.addColorStop(0,'#0a0a2a');bg.addColorStop(1,'#000005');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);stars.forEach(s=>{ctx.fillStyle='rgba(255,255,255,'+s.b+')';ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,6.28);ctx.fill()});let sg=ctx.createRadialGradient(cx,cy,0,cx,cy,45);sg.addColorStop(0,'#ffffaa');sg.addColorStop(1,'rgba(255,100,0,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,45,0,6.28);ctx.fill();ctx.fillStyle='#ffcc00';ctx.shadowColor='#ff0';ctx.shadowBlur=30;ctx.beginPath();ctx.arc(cx,cy,32,0,6.28);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='rgba(0,200,255,0.2)';ctx.beginPath();ctx.arc(cx,cy,150,0,6.28);ctx.stroke();ctx.strokeStyle='rgba(255,80,0,0.2)';ctx.beginPath();ctx.arc(cx,cy,280,0,6.28);ctx.stroke();let ex=cx+Math.cos(t*0.014)*150,ey=cy+Math.sin(t*0.014)*150;ctx.fillStyle='#0066ff';ctx.beginPath();ctx.arc(ex,ey,16,0,6.28);ctx.fill();let mx=cx+Math.cos(t*0.007+2.2)*280,my=cy+Math.sin(t*0.007+2.2)*280;ctx.fillStyle='#ff3300';ctx.beginPath();ctx.arc(mx,my,14,0,6.28);ctx.fill();let sx=flying?ex+(mx-ex)*prog:ex,sy=flying?ey+(my-ey)*prog:ey;if(flying){ctx.strokeStyle='rgba(0,255,0,0.6)';ctx.setLineDash([8,6]);ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(mx,my);ctx.stroke();ctx.setLineDash([])}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy,6,0,6.28);ctx.fill();t++;if(flying&&prog<1){prog+=0.0045;document.getElementById('d').innerText=(259.1*prog).toFixed(1);if(prog>=1){flying=false;document.getElementById('s').innerText='ARRIVED!'}}requestAnimationFrame(draw)}function launch(){flying=true;prog=0}function reset(){flying=false;prog=0;document.getElementById('d').innerText='0.0'}draw();</script></body></html>
