<!DOCTYPE html><html><head><meta charset="utf-8"><title>ZENITH VR v18</title><style>body{margin:0;overflow:hidden;background:#000;font-family:monospace}#overlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,0.9);z-index:100;color:#0ff}#overlay h1{font-size:48px;text-shadow:0 0 20px #0ff}button{padding:15px 30px;margin:10px;background:#0ff;color:#000;border:none;font-size:18px;font-weight:bold;cursor:pointer;border-radius:10px}#hud{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.8);padding:15px;border:1px solid #0ff;color:#0ff;z-index:10;border-radius:10px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body>
<div id="overlay"><h1>🚀 ZENITH VR v18</h1><p>259.1M km WALK EARTH TO MARS IN VR</p><button id="enter">ENTER VR - QUEST READY</button><button id="enter2D">WATCH 2D</button></div>
<div id="hud">MODE: <span id="mode">READY</span><br>Distance: <span id="dist">0</span>/259.1M km</div>
<script type="module">
import * as THREE from 'three'; import {OrbitControls} from 'three/addons/controls/OrbitControls.js'; import {VRButton} from 'three/addons/webxr/VRButton.js';
let scene=new THREE.Scene(); scene.background=new THREE.Color(0x000011);
let cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000); cam.position.set(0,5,20);
let ren=new THREE.WebGLRenderer({antialias:true}); ren.setSize(innerWidth,innerHeight); ren.xr.enabled=true; document.body.appendChild(ren.domElement);
document.body.appendChild(VRButton.createButton(ren));
let con=new OrbitControls(cam,ren.domElement); scene.add(new THREE.AmbientLight(0xffffff,0.9));
let stars=new THREE.BufferGeometry(); let sp=[]; for(let i=0;i<5000;i++)sp.push((Math.random()-0.5)*2000,(Math.random()-0.5)*2000,(Math.random()-0.5)*2000); stars.setAttribute('position',new THREE.Float32BufferAttribute(sp,3)); scene.add(new THREE.Points(stars,new THREE.PointsMaterial({color:0xffffff,size:1.5})));
let earth=new THREE.Mesh(new THREE.SphereGeometry(2,32,32),new THREE.MeshLambertMaterial({color:0x0066FF})); earth.position.set(-20,0,-20); scene.add(earth);
let mars=new THREE.Mesh(new THREE.SphereGeometry(1.5,32,32),new THREE.MeshLambertMaterial({color:0xFF3300})); mars.position.set(20,0,-20); scene.add(mars);
let ship=new THREE.Mesh(new THREE.ConeGeometry(0.3,1,8),new THREE.MeshLambertMaterial({color:0xffffff})); ship.position.copy(earth.position); scene.add(ship);
let prog=0;
document.getElementById('enter').onclick=()=>{document.getElementById('overlay').style.display='none'; document.getElementById('mode').innerText='VR';};
document.getElementById('enter2D').onclick=()=>{document.getElementById('overlay').style.display='none'; document.getElementById('mode').innerText='2D';};
function animate(){ prog+=0.001; if(prog>1)prog=0; ship.position.lerpVectors(earth.position,mars.position,prog); document.getElementById('dist').innerText=(259.1*prog).toFixed(2); earth.rotation.y+=0.01; mars.rotation.y+=0.01; con.update(); ren.render(scene,cam); }
ren.setAnimationLoop(animate);
</script></body></html>
